<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>단축 URL + QR코드 생성기</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #00E5CC;
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: #1e1e2e;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Mono', 'Courier New', monospace;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      opacity: 0.04;
      background-image:
        linear-gradient(var(--accent) 1px, transparent 1px),
        linear-gradient(90deg, var(--accent) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .glow {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 300px;
      background: radial-gradient(ellipse, #00E5CC18 0%, transparent 70%);
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 560px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #00E5CC15;
      border: 1px solid #00E5CC40;
      border-radius: 99px;
      padding: 4px 14px;
      margin-bottom: 20px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .badge-text {
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -1px;
      line-height: 1.3;
    }

    h1 span { color: var(--accent); }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
    }

    .label {
      color: #666;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: block;
      margin-bottom: 10px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: #e0e0e0;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"].error { border-color: #ff4466; }

    .btn-generate {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.5px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-generate:disabled {
      background: #1e1e2e;
      color: #444;
      cursor: not-allowed;
    }

    .error-msg {
      margin-top: 8px;
      color: #ff4466;
      font-size: 12px;
    }

    /* Result */
    .result-card {
      display: none;
    }

    .result-card.visible {
      display: block;
      animation: fadeUp 0.4s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-inner {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .qr-section { flex-shrink: 0; }

    .qr-box {
      background: var(--bg);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      display: inline-block;
    }

    .qr-box img {
      display: block;
      border-radius: 4px;
      width: 160px;
      height: 160px;
    }

    .btn-download {
      margin-top: 10px;
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      color: #888;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn-download:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .urls-section {
      flex: 1;
      min-width: 200px;
    }

    .url-block { margin-bottom: 20px; }

    .url-row {
      background: var(--bg);
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .url-row.highlighted { border-color: #00E5CC40; }

    .url-text {
      flex: 1;
      word-break: break-all;
      font-size: 13px;
      line-height: 1.5;
    }

    .url-text a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .url-text.muted { color: #888; font-size: 12px; }

    .btn-copy {
      background: transparent;
      border: 1px solid var(--border);
      color: #666;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
      flex-shrink: 0;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-copy.copied {
      background: #00E5CC20;
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-reset {
      background: transparent;
      border: none;
      color: #444;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      padding: 0;
      text-decoration: underline;
      margin-top: 16px;
    }

    .footer {
      text-align: center;
      color: #333;
      font-size: 11px;
      margin-top: 24px;
    }
  </style>
</head>
<body>

<div class="grid-bg"></div>
<div class="glow"></div>

<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="badge">
      <span class="badge-dot"></span>
      <span class="badge-text">URL TOOL</span>
    </div>
    <h1>단축 URL + QR코드<br><span>한번에</span></h1>
  </div>

  <!-- Input -->
  <div class="card">
    <label class="label">원본 URL</label>
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="https://example.com/very-long-url" />
      <button class="btn-generate" id="generateBtn" onclick="generate()">생성 →</button>
    </div>
    <p class="error-msg" id="errorMsg" style="display:none;"></p>
  </div>

  <!-- Result -->
  <div class="card result-card" id="resultCard">
    <div class="result-inner">

      <!-- QR -->
      <div class="qr-section">
        <div class="qr-box">
          <img id="qrImg" src="" alt="QR Code" />
        </div>
        <button class="btn-download" onclick="downloadQr()">↓ PNG 다운로드</button>
      </div>

      <!-- URLs -->
      <div class="urls-section">
        <div class="url-block" id="shortBlock">
          <label class="label">단축 URL</label>
          <div class="url-row highlighted">
            <div class="url-text"><a id="shortLink" href="#" target="_blank" rel="noreferrer"></a></div>
            <button class="btn-copy" id="copyShort" onclick="copyText('short')">복사</button>
          </div>
        </div>

        <div class="url-block">
          <label class="label" id="origLabel">원본 URL</label>
          <div class="url-row">
            <div class="url-text muted" id="origText"></div>
            <button class="btn-copy" id="copyOrig" onclick="copyText('orig')">복사</button>
          </div>
        </div>

        <button class="btn-reset" onclick="reset()">← 다시 입력</button>
      </div>
    </div>
  </div>

  <p class="footer">단축 URL: is.gd &nbsp;·&nbsp; QR코드: api.qrserver.com</p>
</div>

<script>
  let currentUrl = "";
  let currentShort = "";

  const urlInput = document.getElementById("urlInput");
  urlInput.addEventListener("keydown", (e) => { if (e.key === "Enter") generate(); });

  function isValidUrl(str) {
    try {
      const u = new URL(str);
      return u.protocol === "http:" || u.protocol === "https:";
    } catch { return false; }
  }

  function getQrSrc(url, size = 160) {
    return `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(url)}&bgcolor=0a0a0f&color=00E5CC&format=png&qzone=2`;
  }

  async function generate() {
    const url = urlInput.value.trim();
    const errorMsg = document.getElementById("errorMsg");
    const btn = document.getElementById("generateBtn");

    if (!isValidUrl(url)) {
      errorMsg.textContent = "올바른 URL을 입력해주세요 (http:// 또는 https:// 포함)";
      errorMsg.style.display = "block";
      urlInput.classList.add("error");
      return;
    }

    errorMsg.style.display = "none";
    urlInput.classList.remove("error");
    btn.disabled = true;
    btn.textContent = "⟳ 생성중";
    currentUrl = url;
    currentShort = "";

    try {
      const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(`https://is.gd/create.php?format=json&url=${encodeURIComponent(url)}`)}`;
      const res = await fetch(proxyUrl);
      const data = await res.json();
      if (data.shorturl) currentShort = data.shorturl;
    } catch (e) {
      currentShort = "";
    }

    showResult();
    btn.disabled = false;
    btn.textContent = "생성 →";
  }

  function showResult() {
    const qrTarget = currentShort || currentUrl;

    document.getElementById("qrImg").src = getQrSrc(qrTarget);

    if (currentShort) {
      document.getElementById("shortBlock").style.display = "block";
      const link = document.getElementById("shortLink");
      link.href = currentShort;
      link.textContent = currentShort;
      document.getElementById("origLabel").textContent = "원본 URL";
    } else {
      document.getElementById("shortBlock").style.display = "none";
      document.getElementById("origLabel").textContent = "URL (QR 코드용)";
    }

    document.getElementById("origText").textContent = currentUrl;

    const card = document.getElementById("resultCard");
    card.classList.remove("visible");
    void card.offsetWidth; // reflow for animation
    card.classList.add("visible");
  }

  function copyText(type) {
    const text = type === "short" ? currentShort : currentUrl;
    const btnId = type === "short" ? "copyShort" : "copyOrig";
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById(btnId);
      btn.textContent = "✓ 복사됨";
      btn.classList.add("copied");
      setTimeout(() => {
        btn.textContent = "복사";
        btn.classList.remove("copied");
      }, 2000);
    });
  }

  function downloadQr() {
    const url = currentShort || currentUrl;
    const link = document.createElement("a");
    link.href = getQrSrc(url, 600);
    link.download = "qrcode.png";
    link.click();
  }

  function reset() {
    urlInput.value = "";
    currentUrl = "";
    currentShort = "";
    document.getElementById("resultCard").classList.remove("visible");
    urlInput.focus();
  }
</script>

</body>
</html>
